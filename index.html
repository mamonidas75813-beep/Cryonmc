    <script>
      // Defensive fix for environments/polyfills attempting to assign window.fetch
      try {
        const _origFetch = window.fetch ? window.fetch.bind(window) : undefined;
        let _customFetch = _origFetch;
        Object.defineProperty(window, 'fetch', {
          get() {
            return _customFetch;
          },
          set(val) {
            _customFetch = val;
          },
          configurable: true,
          enumerable: true
        });
      } catch (e) {
        /* no-op */
      }
    </script>
